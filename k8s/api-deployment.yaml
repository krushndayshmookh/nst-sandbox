# k8s/api-deployment.yaml
# Kubernetes deployment for the NST Sandbox v2 API server.
# Includes: RBAC for provisioning, SQLite PVC, ingress for sandbox.nstsdc.org.

apiVersion: v1
kind: Namespace
metadata:
  name: nst-sandbox-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-provisioner
  namespace: nst-sandbox-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-provisioner
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "services", "persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-provisioner
subjects:
- kind: ServiceAccount
  name: sandbox-provisioner
  namespace: nst-sandbox-api
roleRef:
  kind: ClusterRole
  name: sandbox-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# SQLite database + static assets storage (512Mi — plenty for sqlite + logs)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-data
  namespace: nst-sandbox-api
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: nst-sandbox-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      serviceAccountName: sandbox-provisioner
      containers:
      - name: api
        image: localhost:30500/nst-sandbox-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_PATH
          value: "/data/sandbox.db"
        - name: ADMIN_KEY
          value: "nst-admin-2026"
        # GIT_COMMIT is injected at deploy time (e.g. via CI or build script)
        - name: GIT_COMMIT
          value: "dev"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sandbox-data
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api
  namespace: nst-sandbox-api
spec:
  selector:
    app: sandbox-api
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-api
  namespace: nst-sandbox-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
  - host: sandbox.nstsdc.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandbox-api
            port:
              number: 3000
